# Global Configuration

# Global image settings for all microservices
images:
  repository: us-central1-docker.pkg.dev/google-samples/microservices-demo
  tag: "v0.10.4"
  pullPolicy: IfNotPresent

# Service Account Configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Microservices Configuration
# ---------------------------
# Each service has its own section to configure:
# - enable/disable
# - specific image (if different from global)
# - resource limits (cpu/memory)
# - environment variables

# 1. Email Service (Python)
emailService:
  enabled: true
  name: emailservice
  image: emailservice
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 2. Product Catalog Service (Go)
productCatalogService:
  enabled: true
  name: productcatalogservice
  image: productcatalogservice
  port: 3550
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 3. Currency Service (Node.js)
currencyService:
  enabled: true
  name: currencyservice
  image: currencyservice
  port: 7000
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 4. Payment Service (Node.js)
paymentService:
  enabled: true
  name: paymentservice
  image: paymentservice
  port: 50051
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 5. Shipping Service (Go)
shippingService:
  enabled: true
  name: shippingservice
  image: shippingservice
  port: 50051
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 6. Cart Service (C#)
cartService:
  enabled: true
  name: cartservice
  image: cartservice
  port: 7070
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

# 7. Frontend (Go) - The main public interface
frontend:
  enabled: true
  name: frontend
  image: frontend
  # Service type LoadBalancer for external access, ClusterIP for internal
  service:
    type: LoadBalancer 
    port: 80
  env: 
    platform: local 
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 8. Checkout Service (Go)
checkoutService:
  enabled: true
  name: checkoutservice
  image: checkoutservice
  port: 5050
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 9. Recommendation Service (Python)
recommendationService:
  enabled: true
  name: recommendationservice
  image: recommendationservice
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 220Mi
    limits:
      cpu: 200m
      memory: 450Mi

# 10. Ad Service (Java)
adService:
  enabled: true
  name: adservice
  image: adservice
  port: 9555
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi

# 11. Load Generator (Python/Locust) - Simulates user traffic
loadGenerator:
  enabled: true
  name: loadgenerator
  image: loadgenerator
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Database Configuration
# ----------------------
# Redis Configuration (Used by Cart Service)
redis:
  enabled: true
  name: redis-cart
  # Using public ECR image for better availability than Docker Hub
  image: public.ecr.aws/docker/library/redis:alpine
  port: 6379
  resources:
    requests:
      cpu: 70m
      memory: 200Mi
    limits:
      cpu: 125m
      memory: 256Mi
