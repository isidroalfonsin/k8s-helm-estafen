# Global configuration

# Global image settings for all microservices
images:
  repository: us-central1-docker.pkg.dev/google-samples/microservices-demo
  tag: "v0.10.4"
  pullPolicy: IfNotPresent

# Namespace configuration
namespace:
  name: estafen

# Service Account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Microservices configuration
# Each service has its own section to configure:
# - enable/disable
# - specific image
# - resource limits (cpu/memory)
# - environment variables

# 1. Email Service (Python)
# Sends order confirmation emails (not real implementation)
emailService:
  enabled: true
  name: emailservice
  image: emailservice
  port: 8080  # HTTP port for gRPC server
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 2. Product Catalog Service (Go)
# Provides product listings and search functionality
productCatalogService:
  enabled: true
  name: productcatalogservice
  image: productcatalogservice
  port: 3550  # gRPC port for product catalog queries
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 3. Currency Service (Node.js)
# Converts prices between currencies
currencyService:
  enabled: true
  name: currencyservice
  image: currencyservice
  port: 7000  # gRPC port for currency conversion
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 4. Payment Service (Node.js)
# Processes credit card payments (not real implementation)
paymentService:
  enabled: true
  name: paymentservice
  image: paymentservice
  port: 50051  # Standard gRPC port
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 5. Shipping Service (Go)
# Calculates shipping costs and provides quotes
shippingService:
  enabled: true
  name: shippingservice
  image: shippingservice
  port: 50051  # Standard gRPC port
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 6. Cart Service (C#)
# Manages shopping cart state, stores data in Redis
cartService:
  enabled: true
  name: cartservice
  image: cartservice
  port: 7070  # gRPC port for cart operations
  env:
    redisAddr: "redis-cart:6379"
  resources:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

# 7. Frontend (Go) - The main public interface
# Web UI that users interact with
frontend:
  enabled: true
  name: frontend
  image: frontend
  # Service type LoadBalancer for external access, ClusterIP for internal
  service:
    type: LoadBalancer  # Exposes service externally (gets public IP in cloud)
    port: 80  # External port (what users connect to)
  port: 8080  # Internal container port (where app listens)
  env: 
    platform: local 
    cymbalBranding: "false"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 8. Checkout Service (Go)
# Orchestrates the checkout process (cart, payment, shipping, email)
checkoutService:
  enabled: true
  name: checkoutservice
  image: checkoutservice
  port: 5050  # gRPC port for checkout operations
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# 9. Recommendation Service (Python)
# Suggests products based on cart contents
recommendationService:
  enabled: true
  name: recommendationservice
  image: recommendationservice
  port: 8080  # HTTP port for gRPC server
  resources:
    requests:
      cpu: 100m
      memory: 220Mi
    limits:
      cpu: 200m
      memory: 450Mi

# 10. Ad Service (Java)
# Serves contextual advertisements
adService:
  enabled: true
  name: adservice
  image: adservice
  port: 9555  # gRPC port for ad serving
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi

# 11. Load Generator (Python/Locust) - Simulates user traffic
# Continuously sends requests to simulate real users
loadGenerator:
  enabled: true
  name: loadgenerator
  image: loadgenerator
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Database Configuration
# ----------------------
# Redis Configuration (Used by Cart service)
redis:
  enabled: true
  name: redis-cart
  # Using public ECR image for better availability than Docker Hub
  image: public.ecr.aws/docker/library/redis:alpine
  port: 6379  # Standard Redis port
  persistence:
    enabled: false  # Set to true in values-aws.yaml for persistent storage
    size: 8Gi  # Storage size for PVC
    storageClass: ""  # Leave empty to use default storage class
  resources:
    requests:
      cpu: 70m
      memory: 200Mi
    limits:
      cpu: 125m
      memory: 256Mi
