{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.frontend.name }}
spec:
  # LoadBalancer: Creates external IP (cloud) or localhost access (local)
  type: {{ .Values.frontend.service.type }}
  selector:
    app: {{ .Values.frontend.name }}  # Routes traffic to pods with this label
  ports:
  - name: http
    port: {{ .Values.frontend.service.port }}  # External port (80 = standard HTTP)
    targetPort: {{ .Values.frontend.port }}  # Internal container port (8080)
{{- end }}
