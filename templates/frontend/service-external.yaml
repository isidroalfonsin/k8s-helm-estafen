{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: frontend-external
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.frontend.name }}
spec:
  type: {{ .Values.frontend.type }}
  selector:
    app: {{ .Values.frontend.name }}
  ports:
  - name: http
    port: {{ .Values.frontend.externalPort }}
    targetPort: {{ .Values.frontend.port }}
{{- end }}
