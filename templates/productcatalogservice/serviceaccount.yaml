{{- if .Values.serviceAccounts.create }}
{{- if .Values.productCatalogService.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.productCatalogService.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.productCatalogService.name }}
{{- end }}
{{- end }}
