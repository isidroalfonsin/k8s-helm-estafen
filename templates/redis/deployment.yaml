{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.name }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: {{ .Values.redis.name }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.redis.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.redis.name }}
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: redis
        image: {{ .Values.redis.image }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        ports:
        - containerPort: {{ .Values.redis.port }}  # Standard Redis port (6379)
        # TCP probes: simpler than HTTP, just checks if port is open
        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: {{ .Values.redis.port }}
        livenessProbe:
          periodSeconds: 5
          tcpSocket:
            port: {{ .Values.redis.port }}
        volumeMounts:
        # Mount point where Redis stores data
        - mountPath: /data
          name: redis-data
        resources:
          {{- toYaml .Values.redis.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
      volumes:
      - name: redis-data
        {{- if .Values.redis.persistence.enabled }}
        # PersistentVolumeClaim: data persists across pod restarts (AWS/production)
        persistentVolumeClaim:
          claimName: {{ .Values.redis.name }}-pvc
        {{- else }}
        # emptyDir: temporary storage, data lost if pod restarts (local/dev)
        emptyDir: {}
        {{- end }}
{{- end }}
