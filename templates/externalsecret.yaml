{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "estafen.fullname" . }}-db-secret
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "estafen.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: {{ include "estafen.fullname" . }}-db-secret
    creationPolicy: Owner
  data:
  - secretKey: username
    remoteRef:
      key: {{ .Values.externalSecrets.secretName }}
      property: username
  - secretKey: password
    remoteRef:
      key: {{ .Values.externalSecrets.secretName }}
      property: password
  - secretKey: host
    remoteRef:
      key: {{ .Values.externalSecrets.secretName }}
      property: host
{{- end }}
