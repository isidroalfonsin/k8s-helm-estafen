apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "estafen.fullname" . }}-cluster-role-binding
  labels:
    {{- include "estafen.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "estafen.fullname" . }}-cluster-role
subjects:
- kind: ServiceAccount
  name: {{ include "estafen.serviceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
