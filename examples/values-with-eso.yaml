# Ejemplo: values.yaml con External Secrets habilitado

# Usar este archivo como referencia cuando configures AWS Secrets Manager
# Copia y personaliza según tu entorno

replicaCount: 2

image:
  repository: tu-usuario/estafen-api  # Cambiar por tu imagen
  pullPolicy: IfNotPresent
  tag: "1.0.0"

namespace:
  name: estafen
  create: true

serviceAccount:
  create: true
  # Para EKS con IRSA, agregar anotación:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/estafen-eso-role

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  APP_VERSION: "1.0.0"
  PORT: "8080"

# External Secrets Operator - HABILITADO
externalSecrets:
  enabled: true
  region: us-east-1
  secretName: estafen/database  # Nombre del secreto en AWS Secrets Manager
  refreshInterval: 1h
  useIRSA: true  # Usar IRSA (recomendado para EKS)

# Notas:
# 1. Crear el secreto en AWS Secrets Manager primero
# 2. Configurar IAM policy y IRSA
# 3. Instalar External Secrets Operator
# 4. Desplegar con: helm install estafen . --values examples/values-with-eso.yaml
